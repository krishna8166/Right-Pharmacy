<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ shop_name }} — Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #F4F6FB;
  --surf:    #FFFFFF;
  --nav:     #16213E;
  --nav-sel: #0F3460;
  --nav-hvr: #1A2A50;
  --pri:     #4361EE;
  --pri-lt:  #EEF1FE;
  --succ:    #10B981;
  --succ-lt: #ECFDF5;
  --danger:  #EF4444;
  --dang-lt: #FEF2F2;
  --warn:    #F59E0B;
  --warn-lt: #FFFBEB;
  --txt:     #0F172A;
  --txt2:    #475569;
  --txt3:    #94A3B8;
  --border:  #E2E8F0;
  --f:       'Segoe UI', system-ui, sans-serif;
}
body { font-family: var(--f); background: var(--bg); color: var(--txt); }
button, input, select { font-family: var(--f); outline: none; }
button { cursor: pointer; border: none; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ═══════════════════════════════════════
   LOGIN PAGE
═══════════════════════════════════════ */
.login-wrap {
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  background: var(--nav);
}
.login-card {
  background: var(--surf); border-radius: 16px;
  padding: 44px 48px; width: 100%; max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,.25);
}
.login-logo { font-size: 2.4rem; margin-bottom: 6px; }
.login-title { font-size: 1.65rem; font-weight: 700; margin-bottom: 4px; }
.login-sub { color: var(--txt2); font-size: .92rem; margin-bottom: 28px; }
.field-label {
  display: block; font-size: .75rem; font-weight: 700;
  color: var(--txt3); letter-spacing: .06em; margin-bottom: 6px;
}
.field-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 1rem; background: #F8FAFC; color: var(--txt);
  transition: border-color .15s;
}
.field-input:focus { border-color: var(--pri); }
.login-err { color: var(--danger); font-size: .85rem; min-height: 20px; margin: 8px 0; }
.btn-login {
  width: 100%; padding: 13px;
  background: var(--pri); color: white;
  border-radius: 8px; font-size: 1rem; font-weight: 600;
  transition: background .15s;
}
.btn-login:hover { background: #3047C8; }

/* ═══════════════════════════════════════
   DASHBOARD LAYOUT
═══════════════════════════════════════ */
.layout { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 220px; background: var(--nav);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.sb-logo {
  height: 66px; display: flex; align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #253350;
  font-size: 1.05rem; font-weight: 700; color: white;
  gap: 10px;
}
.sb-nav { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 8px;
  font-size: .95rem; color: #94A3B8;
  background: transparent; transition: background .14s, color .14s;
  text-align: left; width: 100%;
}
.nav-item:hover { background: var(--nav-hvr); color: white; }
.nav-item.active { background: var(--nav-sel); color: white; }
.nav-item .badge {
  margin-left: auto; background: var(--warn);
  color: white; font-size: .7rem; font-weight: 700;
  padding: 2px 7px; border-radius: 99px;
  display: none;
}
.nav-item .badge.show { display: inline-block; }
.sb-stats { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.stat-card {
  background: #1E293B; border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid #334155;
}
.stat-val { font-size: 1.35rem; font-weight: 800; }
.stat-lbl { font-size: .75rem; color: #64748B; margin-top: 2px; }
.sb-footer {
  border-top: 1px solid #253350;
  padding: 10px;
}
.btn-logout {
  width: 100%; padding: 11px 14px;
  background: transparent; color: #64748B;
  border-radius: 8px; font-size: .9rem;
  text-align: left; transition: background .14s, color .14s;
  display: flex; align-items: center; gap: 10px;
}
.btn-logout:hover { background: var(--nav-hvr); color: white; }

/* Content */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.panel.active { display: flex; }

/* Panel header */
.panel-hdr {
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 68px;
  display: flex; align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.panel-title { font-size: 1.2rem; font-weight: 700; }
.live-dot {
  width: 8px; height: 8px; background: var(--succ);
  border-radius: 50%; display: inline-block; margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.panel-body { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* Buttons */
.btn {
  padding: 8px 18px; border-radius: 8px;
  font-size: .88rem; font-weight: 600;
  transition: opacity .14s, transform .1s;
}
.btn:hover { opacity: .88; transform: translateY(-1px); }
.btn-pri  { background: var(--pri);   color: white; }
.btn-soft { background: var(--pri-lt); color: var(--pri); }
.btn-succ { background: var(--succ);  color: white; }
.btn-ghost{ background: var(--bg);    color: var(--txt2); }
.btn-sm   { padding: 5px 12px; font-size: .8rem; }

/* ═══════════════════════════════════════
   ORDERS PANEL
═══════════════════════════════════════ */
.order-card {
  background: var(--surf); border-radius: 12px;
  border: 1px solid var(--border); overflow: hidden;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  transition: box-shadow .15s;
}
.order-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.09); }
.order-accent { height: 3px; background: var(--warn); }
.order-top {
  padding: 16px 20px 10px;
  display: flex; align-items: flex-start;
  justify-content: space-between;
}
.order-id   { font-size: 1rem; font-weight: 700; }
.order-time { font-size: .8rem; color: var(--txt3); margin-top: 2px; }
.order-badge {
  font-size: .75rem; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
  background: var(--warn-lt); color: var(--warn);
  white-space: nowrap;
}
.order-div { height: 1px; background: var(--bg); margin: 0 20px; }
.order-mid { padding: 10px 20px; }
.order-customer { font-weight: 600; margin-bottom: 4px; }
.order-items { font-size: .82rem; color: var(--txt3); line-height: 1.5; }
.order-bot {
  padding: 10px 20px 16px;
  display: flex; align-items: center;
  justify-content: space-between;
}
.order-total { font-size: 1.25rem; font-weight: 800; }
.no-orders {
  background: var(--succ-lt); border-radius: 12px;
  border: 1px solid #A7F3D0;
  text-align: center; padding: 36px;
  color: var(--succ); font-size: 1rem; font-weight: 600;
}

/* ═══════════════════════════════════════
   INVENTORY PANEL
═══════════════════════════════════════ */
.inv-search {
  display: flex; align-items: center; gap: 10px;
  background: var(--surf); border: 1px solid var(--border);
  border-radius: 10px; padding: 0 14px;
  margin-bottom: 14px; transition: border-color .15s;
}
.inv-search:focus-within { border-color: var(--pri); }
.inv-search input {
  border: none; background: none; padding: 11px 0;
  font-size: .95rem; color: var(--txt); flex: 1;
}
.inv-table { width: 100%; border-collapse: collapse; }
.inv-table th {
  text-align: left; font-size: .75rem; font-weight: 700;
  color: var(--txt3); letter-spacing: .05em;
  padding: 10px 14px; background: #F0F4F8;
  border-bottom: 1px solid var(--border);
}
.inv-table td {
  padding: 0; vertical-align: middle;
  border-bottom: 1px solid var(--border);
}
.inv-table tr:last-child td { border-bottom: none; }
.inv-table tr { background: var(--surf); transition: background .1s; }
.inv-table tr:nth-child(even) { background: #F8FAFC; }
.inv-table tr:hover { background: var(--pri-lt); }
.td-inner { padding: 10px 14px; }
.inv-accent-stripe {
  display: inline-block; width: 4px;
  background: currentColor; align-self: stretch;
}
.inv-cat-badge {
  font-size: .72rem; font-weight: 700;
  padding: 3px 8px; border-radius: 5px;
  color: white; white-space: nowrap;
}
.inv-name { font-weight: 600; font-size: .92rem; }
.inv-price { font-size: .92rem; color: var(--txt2); }
.stock-ctrl { display: flex; align-items: center; gap: 6px; }
.stock-btn {
  width: 30px; height: 30px; border-radius: 6px;
  font-size: .95rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .12s;
}
.stock-btn:hover { opacity: .8; }
.s-minus { background: var(--dang-lt); color: var(--danger); }
.s-plus  { background: var(--succ-lt); color: var(--succ); }
.s-10    { background: var(--pri-lt);  color: var(--pri);   font-size: .75rem; width:auto; padding: 0 8px; }
.s-50    { background: #F3E8FF;        color: #7C3AED;      font-size: .75rem; width:auto; padding: 0 8px; }
.stock-input {
  width: 52px; text-align: center; padding: 5px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: .95rem; font-weight: 700; background: #F8FAFC;
  transition: border-color .15s;
}
.stock-input:focus { border-color: var(--pri); }

/* ═══════════════════════════════════════
   SALES PANEL
═══════════════════════════════════════ */
.sales-filter {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.sales-filter input[type="date"] {
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: .92rem; background: var(--surf);
  transition: border-color .15s;
}
.sales-filter input:focus { border-color: var(--pri); }
.sales-summary {
  background: var(--surf); border-radius: 12px;
  border: 1px solid var(--border);
  padding: 16px 22px; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.ss-label { font-size: .92rem; color: var(--txt2); }
.ss-right { display: flex; align-items: baseline; gap: 14px; }
.ss-total { font-size: 1.45rem; font-weight: 800; color: var(--succ); }
.ss-count { font-size: .85rem; color: var(--txt3); }
.sale-row {
  background: var(--surf); border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 10px; overflow: hidden; display: flex;
  transition: box-shadow .15s;
}
.sale-row:hover { box-shadow: 0 2px 10px rgba(0,0,0,.07); }
.sale-stripe { width: 4px; background: var(--succ); flex-shrink: 0; }
.sale-body { flex: 1; padding: 12px 16px; }
.sale-top {
  display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
}
.sale-id   { font-weight: 700; font-size: .95rem; }
.sale-date {
  font-size: .75rem; font-weight: 700;
  background: var(--succ-lt); color: var(--succ);
  padding: 3px 8px; border-radius: 6px;
}
.sale-items { font-size: .8rem; color: var(--txt3); margin: 4px 0 6px; line-height: 1.5; }
.sale-bot {
  display: flex; align-items: center; justify-content: space-between;
}
.sale-delivered {
  font-size: .75rem; font-weight: 700;
  background: var(--succ-lt); color: var(--succ);
  padding: 3px 8px; border-radius: 6px;
}
.sale-amount { font-size: 1.05rem; font-weight: 800; color: var(--succ); }

/* ── Toast ─────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--txt); color: white; padding: 12px 24px;
  border-radius: 10px; font-weight: 600; font-size: .9rem;
  z-index: 999; opacity: 0; pointer-events: none; transition: opacity .25s;
}
.toast.show { opacity: 1; }

/* Loader */
.loader { display: flex; align-items: center; gap: 10px;
          padding: 40px 0; color: var(--txt3); }
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border);
  border-top-color: var(--pri); border-radius: 50%;
  animation: spin .65s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

{% if page == "login" %}
<!-- ═══════════════ LOGIN PAGE ═══════════════ -->
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">⚙️</div>
    <div class="login-title">Admin Login</div>
    <div class="login-sub">{{ shop_name }} — Management Dashboard</div>

    <label class="field-label" for="pw">PASSWORD</label>
    <input class="field-input" type="password" id="pw"
           placeholder="Enter admin password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="login-err"></div>
    <button class="btn-login" onclick="doLogin()">Continue →</button>
  </div>
</div>

<script>
async function doLogin() {
  const pw  = document.getElementById("pw").value;
  const err = document.getElementById("login-err");
  const res = await fetch("/admin/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({password: pw})
  }).then(r => r.json()).catch(() => ({ok:false}));

  if (res.ok) {
    window.location.href = "/admin/dashboard";
  } else {
    err.textContent = "❌  Incorrect password — try again";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}
document.getElementById("pw").focus();
</script>

{% else %}
<!-- ═══════════════ DASHBOARD ═══════════════ -->
<div class="layout">

  <!-- ── Sidebar ─────────────────────────── -->
  <aside class="sidebar">
    <div class="sb-logo">⚕️ &nbsp; Admin</div>

    <nav class="sb-nav">
      <button class="nav-item active" id="nav-orders" onclick="switchTab('orders')">
        📦 &nbsp;Orders
        <span class="badge" id="orders-badge">0</span>
      </button>
      <button class="nav-item" id="nav-inventory" onclick="switchTab('inventory')">
        🗄️ &nbsp;Inventory
      </button>
      <button class="nav-item" id="nav-sales" onclick="switchTab('sales')">
        📒 &nbsp;Sales Book
      </button>
    </nav>

    <!-- Live stats -->
    <div style="padding:0 10px 6px;font-size:.7rem;font-weight:700;color:#475569;letter-spacing:.06em">
      TODAY
    </div>
    <div class="sb-stats" id="sb-stats">
      <div class="stat-card">
        <div class="stat-val" id="s-pending" style="color:var(--warn)">—</div>
        <div class="stat-lbl">Pending Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="s-rev" style="color:var(--succ)">—</div>
        <div class="stat-lbl">Today's Revenue</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="s-oos" style="color:var(--danger)">—</div>
        <div class="stat-lbl">Out of Stock</div>
      </div>
    </div>

    <div class="sb-footer">
      <a href="/admin/logout">
        <button class="btn-logout">← &nbsp;Logout</button>
      </a>
    </div>
  </aside>

  <!-- ── Content ─────────────────────────── -->
  <main class="content">

    <!-- ORDERS -->
    <section class="panel active" id="panel-orders">
      <div class="panel-hdr">
        <div>
          <span class="live-dot"></span>
          <span class="panel-title">Pending Orders</span>
          <span style="font-size:.8rem;color:var(--txt3);margin-left:8px">
            auto-refreshes every 10 s
          </span>
        </div>
        <button class="btn btn-soft btn-sm" onclick="loadOrders()">🔄 Refresh</button>
      </div>
      <div class="panel-body" id="orders-body">
        <div class="loader"><div class="spinner"></div> Loading…</div>
      </div>
    </section>

    <!-- INVENTORY -->
    <section class="panel" id="panel-inventory">
      <div class="panel-hdr">
        <span class="panel-title">Inventory Management</span>
        <button class="btn btn-soft btn-sm" onclick="loadInventory()">🔄 Refresh</button>
      </div>
      <div class="panel-body">
        <div class="inv-search">
          <span>🔍</span>
          <input type="text" id="inv-search" placeholder="Search items by name…"
                 oninput="debInv()">
        </div>
        <div id="inv-body">
          <div class="loader"><div class="spinner"></div> Loading…</div>
        </div>
      </div>
    </section>

    <!-- SALES -->
    <section class="panel" id="panel-sales">
      <div class="panel-hdr">
        <span class="panel-title">Sales & Purchase Book</span>
        <button class="btn btn-soft btn-sm" onclick="loadSales()">🔄 Refresh</button>
      </div>
      <div class="panel-body">
        <div class="sales-filter">
          <span>📅</span>
          <input type="date" id="sales-date">
          <button class="btn btn-pri btn-sm"   onclick="loadSales()">Filter</button>
          <button class="btn btn-ghost btn-sm" onclick="clearDate()">Show All</button>
        </div>
        <div class="sales-summary" id="sales-summary">
          <span class="ss-label">Loading…</span>
        </div>
        <div id="sales-body"></div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Category metadata ────────────────────────────
const CAT = {
  "Chips":      { icon:"🍟", color:"#F57C00" },
  "Drinks":     { icon:"🥤", color:"#1565C0" },
  "Chocolates": { icon:"🍫", color:"#6D4C41" },
  "Ice Cream":  { icon:"🍦", color:"#00838F" },
};

// ── Tab switching ────────────────────────────────
function switchTab(tab) {
  ["orders","inventory","sales"].forEach(t => {
    document.getElementById("panel-" + t).classList.remove("active");
    document.getElementById("nav-"   + t).classList.remove("active");
  });
  document.getElementById("panel-" + tab).classList.add("active");
  document.getElementById("nav-"   + tab).classList.add("active");
  if (tab === "orders")    loadOrders();
  if (tab === "inventory") loadInventory();
  if (tab === "sales")     loadSales();
}

// ── Stats ────────────────────────────────────────
async function loadStats() {
  const s = await fetch("/api/admin/stats").then(r=>r.json()).catch(()=>({}));
  document.getElementById("s-pending").textContent = s.pending ?? "—";
  document.getElementById("s-rev").textContent     = s.today_rev != null ? `₹${s.today_rev.toFixed(0)}` : "—";
  document.getElementById("s-oos").textContent     = s.out_of_stock ?? "—";
  // Orders badge in nav
  const badge = document.getElementById("orders-badge");
  badge.textContent = s.pending ?? 0;
  badge.classList.toggle("show", (s.pending ?? 0) > 0);
}

// ── ORDERS ───────────────────────────────────────
async function loadOrders() {
  const body = document.getElementById("orders-body");
  const orders = await fetch("/api/admin/orders").then(r=>r.json()).catch(()=>[]);
  loadStats();

  if (!orders.length) {
    body.innerHTML = `<div class="no-orders">✅  All clear — no pending orders right now</div>`;
    return;
  }
  body.innerHTML = orders.map(o => {
    const items = JSON.parse(o.items_json);
    const itemsStr = items.map(i => `${i.name} × ${i.qty}`).join("   •   ");
    return `
    <div class="order-card">
      <div class="order-accent"></div>
      <div class="order-top">
        <div>
          <div class="order-id">Order #${o.id}</div>
          <div class="order-time">🕐 ${o.created_at}</div>
        </div>
        <span class="order-badge">⏳ Pending</span>
      </div>
      <div class="order-div"></div>
      <div class="order-mid">
        <div class="order-customer">👤  ${o.customer_name}</div>
        <div class="order-items">${itemsStr}</div>
      </div>
      <div class="order-div"></div>
      <div class="order-bot">
        <span class="order-total">₹${parseFloat(o.total).toFixed(2)}</span>
        <button class="btn btn-succ" onclick="deliver(${o.id}, this)">
          ✓ &nbsp;Mark as Delivered
        </button>
      </div>
    </div>`;
  }).join("");
}

async function deliver(oid, btn) {
  if (!confirm(`Mark Order #${oid} as delivered?\n\n• Stock will reduce\n• Sale will be recorded`)) return;
  btn.disabled = true; btn.textContent = "Processing…";
  const res = await fetch(`/api/admin/deliver/${oid}`, {method:"POST"}).then(r=>r.json()).catch(()=>({ok:false}));
  if (res.ok) {
    showToast(`✅ Order #${oid} delivered! Sale recorded.`);
    loadOrders(); loadStats();
  } else {
    showToast("❌ Something went wrong");
    btn.disabled = false; btn.textContent = "✓ Mark as Delivered";
  }
}

// Auto-refresh orders every 10 seconds
setInterval(() => {
  if (document.getElementById("panel-orders").classList.contains("active")) {
    loadOrders();
  } else {
    loadStats();  // always keep stats fresh
  }
}, 10000);

// ── INVENTORY ────────────────────────────────────
let invDebTimer;
function debInv() {
  clearTimeout(invDebTimer);
  invDebTimer = setTimeout(loadInventory, 300);
}

async function loadInventory() {
  const search = document.getElementById("inv-search").value.trim();
  const items  = await fetch(`/api/admin/inventory?search=${encodeURIComponent(search)}`)
                   .then(r=>r.json()).catch(()=>[]);

  const body = document.getElementById("inv-body");
  if (!items.length) {
    body.innerHTML = `<p style="color:var(--txt3);padding:32px 0">No items found.</p>`;
    return;
  }

  body.innerHTML = `
  <table class="inv-table">
    <thead>
      <tr>
        <th>CATEGORY</th>
        <th>ITEM NAME</th>
        <th>PRICE</th>
        <th>STOCK</th>
        <th>ADJUST STOCK</th>
      </tr>
    </thead>
    <tbody>
      ${items.map(item => {
        const m    = CAT[item.category] || {icon:"🛍️", color:"#4361EE"};
        const sfg  = item.stock > 10 ? "var(--succ)" : item.stock > 0 ? "var(--warn)" : "var(--danger)";
        return `
        <tr>
          <td>
            <div class="td-inner" style="display:flex;align-items:center;gap:0">
              <div style="width:4px;background:${m.color};align-self:stretch;margin-right:10px;border-radius:2px"></div>
              <span class="inv-cat-badge" style="background:${m.color}">${m.icon} ${item.category}</span>
            </div>
          </td>
          <td><div class="td-inner inv-name">${item.name}</div></td>
          <td><div class="td-inner inv-price">₹${item.price}</div></td>
          <td><div class="td-inner" style="font-size:1.1rem;font-weight:800;color:${sfg}">${item.stock}</div></td>
          <td>
            <div class="td-inner">
              <div class="stock-ctrl">
                <button class="stock-btn s-minus" onclick="adjStock(${item.id},-1,this)">−</button>
                <input  class="stock-input" id="si-${item.id}" value="${item.stock}"
                        onkeydown="if(event.key==='Enter')setStock(${item.id},this.value)"
                        onblur="setStock(${item.id},this.value)">
                <button class="stock-btn s-plus"  onclick="adjStock(${item.id},+1,this)">+</button>
                <button class="stock-btn s-10"    onclick="adjStock(${item.id},+10,this)">+10</button>
                <button class="stock-btn s-50"    onclick="adjStock(${item.id},+50,this)">+50</button>
              </div>
            </div>
          </td>
        </tr>`;
      }).join("")}
    </tbody>
  </table>`;
}

async function adjStock(id, delta, btn) {
  btn.disabled = true;
  const res = await fetch(`/api/admin/stock/${id}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({delta})
  }).then(r=>r.json()).catch(()=>({ok:false}));
  if (res.ok) {
    const inp = document.getElementById("si-" + id);
    if (inp) inp.value = res.stock;
    const row = btn.closest("tr");
    if (row) {
      const cells = row.querySelectorAll("td");
      if (cells[3]) {
        const sfg = res.stock > 10 ? "var(--succ)" : res.stock > 0 ? "var(--warn)" : "var(--danger)";
        cells[3].querySelector("div").style.color = sfg;
        cells[3].querySelector("div").textContent = res.stock;
      }
    }
    loadStats();
  }
  btn.disabled = false;
}

async function setStock(id, rawVal) {
  const val = parseInt(rawVal);
  if (isNaN(val) || val < 0) return;
  const res = await fetch(`/api/admin/stock/${id}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({value: val})
  }).then(r=>r.json()).catch(()=>({ok:false}));
  if (res.ok) {
    const inp = document.getElementById("si-" + id);
    if (inp) inp.value = res.stock;
    loadStats();
  }
}

// ── SALES ────────────────────────────────────────
function clearDate() {
  document.getElementById("sales-date").value = "";
  loadSales();
}

async function loadSales() {
  const date = document.getElementById("sales-date").value;
  const url  = "/api/admin/sales" + (date ? `?date=${date}` : "");
  const data = await fetch(url).then(r=>r.json()).catch(()=>({sales:[],total:0}));

  const sum = document.getElementById("sales-summary");
  const lbl = date ? `Sales for ${date}` : "All-time Grand Total";
  sum.innerHTML = `
    <span class="ss-label">📊  ${lbl}</span>
    <div class="ss-right">
      <span class="ss-count">${data.sales.length} transactions</span>
      <span class="ss-total">₹${parseFloat(data.total).toFixed(2)}</span>
    </div>`;

  const body = document.getElementById("sales-body");
  if (!data.sales.length) {
    body.innerHTML = `<p style="color:var(--txt3);padding:32px 0">No sales records for this period.</p>`;
    return;
  }
  body.innerHTML = data.sales.map(s => {
    const items    = JSON.parse(s.items_json);
    const itemsStr = items.map(i => `${i.name} ×${i.qty}`).join("  •  ");
    return `
    <div class="sale-row">
      <div class="sale-stripe"></div>
      <div class="sale-body">
        <div class="sale-top">
          <span class="sale-id">🧾  Order #${s.order_id} — ${s.customer_name}</span>
          <span class="sale-date">✓ ${s.sale_date}</span>
        </div>
        <div class="sale-items">${itemsStr}</div>
        <div class="sale-bot">
          <span class="sale-delivered">Delivered</span>
          <span class="sale-amount">₹${parseFloat(s.amount).toFixed(2)}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

// ── Toast ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

// ── Bootstrap ────────────────────────────────────
const today = new Date().toISOString().slice(0,10);
if (!document.getElementById("sales-date").value)
  document.getElementById("sales-date").value = today;

loadOrders();
loadStats();
</script>
{% endif %}
